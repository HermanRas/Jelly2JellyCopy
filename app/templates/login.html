{% extends "base.html" %}
{% block header %}{% endblock %}
{% block content %}
<div class="login-wrap">
  <form class="card login-card" method="post" action="/login">
    <img class="login-banner" src="/static/img/banner.jpeg" alt="Jelly2JellyCopy: copy media from one Jellyfin server to another">
    <h1 class="brand"><i class="bi bi-arrow-left-right"></i> Jelly2Jelly<span>Copy</span></h1>
    <input type="hidden" name="next" value="{{ next }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    {% if error %}<p class="error"><i class="bi bi-x-octagon"></i> {{ error }}</p>{% endif %}
    <button type="submit" class="btn btn-primary"><i class="bi bi-unlock"></i> Log in</button>
  </form>
</div>
{% endblock %}
