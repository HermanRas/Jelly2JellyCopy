# Dev overlay: live-reload the source without letting caches touch the host tree.
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  jelly2jelly:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./app:/srv/app:ro          # source, read-only so nothing writes back to Drive
      - j2j-data:/data
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
